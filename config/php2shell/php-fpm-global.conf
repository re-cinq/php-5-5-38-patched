; PHP2Shell hardening for php-fpm.conf, [global] section. See README.md.

; Reload the master if workers die from SIGSEGV/SIGBUS (memory corruption).
; Only those signals count: the patch's clean exits (code 1 on memory_limit,
; 124 on max_execution_time) do not trigger a reload.
emergency_restart_threshold = 10
emergency_restart_interval = 1m

; Give workers a bounded time to finish when the master reloads or stops.
process_control_timeout = 10s

; Do not cap worker memory with RLIMIT_AS / RLIMIT_DATA (e.g. systemd
; LimitAS= / LimitDATA= on the php-fpm unit, or ulimit -v / -d): the advisory
; warns they reach the same vulnerable failure paths. Use memory_limit.
