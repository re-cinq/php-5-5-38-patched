# PHP2Shell hardening for Apache httpd with mod_php 5.5. Include it in the main
# server configuration. See README.md.

# The patch terminates the process on memory_limit or max_execution_time. Use
# the prefork MPM: under a threaded MPM (worker/event, ZTS PHP) that would also
# kill every other request handled by the same process.
<IfModule mpm_prefork_module>
    # Recycle children after a bounded number of connections, so no state
    # lives in a child for long (CVE-2026-109619). Apache 2.2: MaxRequestsPerChild.
    # Emergency measure on hosts that cannot be patched yet: 1 (fresh child per
    # connection; does not protect the request that triggers the corruption).
    MaxConnectionsPerChild 500
</IfModule>

# Bound what reaches PHP's request parser, which runs before any application
# code (the unauthenticated window on mod_php). Keep LimitRequestBody in line
# with post_max_size (8M in zz-php2shell.ini).
LimitRequestBody 8388608
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestLine 8190
Timeout 60

# No version banners.
ServerTokens Prod
ServerSignature Off

<IfModule php5_module>
    # Enforce request-parsing settings so .htaccess / ini_set() cannot loosen them.
    php_admin_flag session.upload_progress.enabled off
    php_admin_value post_max_size 8M
    php_admin_value upload_max_filesize 8M
    php_admin_value max_file_uploads 20
    php_admin_value max_input_vars 1000
    php_admin_value max_input_nesting_level 16
    php_admin_value max_multipart_body_parts -1
    php_admin_value max_input_time 30
</IfModule>

# Do not use RLimitMEM (or ulimit -v / -d for httpd): it sets RLIMIT_AS /
# RLIMIT_DATA, which the advisory warns reach the same vulnerable failure
# paths. Use memory_limit.
