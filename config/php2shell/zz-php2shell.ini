; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) hardening for patched PHP 5.5.
; Drop into the conf.d directory of every SAPI (FPM, apache2, CLI) so it is
; loaded last. Values marked "tune" depend on the application. See README.md.
;
; These settings reduce attack surface and blast radius. They do not replace
; the patch: on an unpatched PHP no configuration closes the vulnerability.

; --- Request parsing (runs before any application code) -------------------
; Body and input limits bound the work and memory spent parsing a request
; before the application runs; that is the unauthenticated window.
post_max_size = 8M                  ; tune; keep well below memory_limit
upload_max_filesize = 8M            ; tune; <= post_max_size
max_file_uploads = 20               ; tune
max_input_vars = 1000
max_input_nesting_level = 16        ; default 64; deep nesting multiplies allocations
max_multipart_body_parts = -1       ; new in this patch; -1 = max_input_vars + max_file_uploads
max_input_time = 30                 ; CPU seconds for parsing the request (default -1: unlimited)
; If the application never accepts uploads, also disable the multipart parser:
; file_uploads = Off

; Session upload progress (un)serializes the session while the body is parsed.
; The patch disables it unconditionally; keep it off explicitly as well.
session.upload_progress.enabled = Off

; --- Execution limits -----------------------------------------------------
; With the patch, reaching either limit terminates the worker without running
; shutdown functions or destructors. Keep both finite.
memory_limit = 128M                 ; tune; never -1
max_execution_time = 30             ; tune

; --- Information exposure and logging -------------------------------------
expose_php = Off                    ; no X-Powered-By: PHP/5.5.38 version banner
display_errors = Off
display_startup_errors = Off
log_errors = On
; The patch writes OOM/timeout fatal errors to the process stderr (not to
; error_log): FPM needs catch_workers_output = yes, Apache logs it to ErrorLog.
