; PHP2Shell hardening for each php-fpm pool section (e.g. [www]). See README.md.

; Recycle workers after a bounded number of requests, so no state lives in a
; worker for long (CVE-2026-109619 is state leaking from one request into the
; next). As an emergency measure on hosts that cannot be patched yet,
; pm.max_requests = 1 gives every request a fresh worker; it does not protect
; the request that triggers the corruption, and costs a fork per request.
pm.max_requests = 500

; Kill a request from the master (SIGTERM) if it outlives max_execution_time
; and max_input_time, e.g. while blocked in I/O where PHP's CPU timer does not
; run. Keep it above both.
request_terminate_timeout = 60s

; The patch writes OOM/timeout fatal errors to the worker's stderr. Without
; this they are discarded and the only trace is "exited with code 1/124".
catch_workers_output = yes

; Only execute .php files.
security.limit_extensions = .php

; Enforce the request-parsing settings per pool, so they cannot be loosened
; from .user.ini or ini_set().
php_admin_flag[session.upload_progress.enabled] = off
php_admin_value[post_max_size] = 8M
php_admin_value[upload_max_filesize] = 8M
php_admin_value[max_file_uploads] = 20
php_admin_value[max_input_vars] = 1000
php_admin_value[max_input_nesting_level] = 16
php_admin_value[max_multipart_body_parts] = -1
php_admin_value[max_input_time] = 30
