; Deliberately hostile per-directory values. The FPM pool must keep the
; security limits at their php_admin values while still loading this file.
precision = 12
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 200
max_input_vars = 10000
max_input_nesting_level = 64
max_multipart_body_parts = 20000
max_input_time = -1
session.upload_progress.enabled = On
